<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Server OS</title><link rel="stylesheet" href="/style.css"></head><body><div id="login"><div class="loginbox"><b class="symbol">✦</b><h1>RIFT SERVER OS</h1><p>Minecraft a celý server na jednom místě.</p><form id="login-form"><label>Uživatelské jméno<input name="name" autocomplete="username" required></label><label>Heslo<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Přihlásit se</button></form><div id="setup" hidden><p>První nastavení na tomto počítači: zvol heslo správce.</p><form id="setup-form"><label>Nové heslo (alespoň 12 znaků)<input type="password" minlength="12" name="password" required></label><button class="primary">Uložit heslo</button></form></div></div></div><div id="app" hidden><aside><div class="brand"><span class="symbol">✦</span><strong>RIFT<br><small>SERVER OS</small></strong></div><nav id="nav"><span>MINECRAFT</span><button data-page="overview">▣ Přehled</button><button data-page="create">＋ Nový server</button><button data-page="console">▤ Konzole</button><button data-page="players">♟ Hráči</button><button data-page="files">▧ Soubory</button><button data-page="backup">◷ Zálohy</button><button data-page="jobs">◇ Úlohy</button><span>POČÍTAČ</span><button data-page="machine">▥ Stav stroje</button><button data-page="database">▤ Databáze</button><button data-page="services">⌘ Služby</button><button data-page="power">⏻ Napájení</button><button data-page="account">⚙ Účet</button></nav><button id="logout">Odhlásit se</button></aside><div class="workspace"><header><div><small>CONTROL CENTER</small><h2 id="title">Přehled</h2></div><select id="server-select" aria-label="Vybraný server"></select></header><main id="main"></main></div></div><div id="toast" role="status"></div><script src="/ui.js" defer></script></body></html>
